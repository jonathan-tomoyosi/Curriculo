name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      # O `build` já roda scripts/verify-trace.mjs: falha se um arquivo obrigatório em
      # tempo de execução não chegar à função serverless — erro que só apareceria em
      # produção, porque `next start` local enxerga o node_modules inteiro.
      - name: Build de produção e verificação do rastreamento
        run: npm run build

  e2e:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar Playwright
        run: npm run test:e2e

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
